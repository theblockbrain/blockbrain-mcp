version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    # Both Python stages use the same `python:<minor>-slim-bookworm@sha256:...`
    # reference, so Dependabot always moves them together. A new Python minor
    # or major is ignored here: it also has to change `.python-version` (what
    # CI tests on), so it is a deliberate, manual bump. Python patch releases
    # and Debian rebuilds republish the same tag under a new digest; Dependabot
    # proposes those as digest updates on the pinned reference. uv has its own
    # FROM stage, so its version and digest are updated as well.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
