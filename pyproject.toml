[project]
name = "blockbrain-mcp"
version = "0.2.0"
description = "Blockbrain-compatible Python MCP Server with OAuth 2.1 — customer template"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Blockbrain" }]
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.2.5,<5",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28,<0.29",
    "httpcore>=1.0",
    "trafilatura>=2.4",
    "structlog>=24.4",
    "authlib>=1.9.10",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17.6",
    "respx>=0.22",
    "pyjwt[crypto]>=2.15.1",
    "pip-audit>=2.9",
]

[project.scripts]
blockbrain-mcp = "blockbrain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockbrain_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length enforced by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
